        const d = new Date(current);
        d.setDate(d.getDate() + delta);
        document.getElementById("coffee-date").value = formatDate(
          d.toISOString().split("T")[0],
        );
        if (coffeeView === "log") await renderCoffeeLog();
      }

      document.getElementById("coffee-date").addEventListener("input", (e) => {
        const el = e.target;
        if (el.selectionStart !== el.value.length) return;
        let digits = el.value.replace(/\D/g, "").slice(0, 8);
        let fmt = digits;
        if (digits.length > 2) fmt = digits.slice(0, 2) + "/" + digits.slice(2);
        if (digits.length > 4) fmt = fmt.slice(0, 5) + "/" + fmt.slice(5);
        el.value = fmt;
      });

      document
        .getElementById("coffee-date")
        .addEventListener("blur", async () => {
          if (coffeeView === "log") await renderCoffeeLog();
        });

      // ── View toggle ──────────────────────────────────────────────
      function setCoffeeView(view) {
        coffeeView = view;
        document
          .getElementById("coffee-log-view")
          .classList.toggle("hidden", view !== "log");
        document
          .getElementById("coffee-cal-view")
          .classList.toggle("hidden", view !== "cal");
        document.getElementById("coffee-btn-log").className =
          "px-3 py-1.5 rounded-lg text-xs font-bold transition-colors " +
          (view === "log" ? "bg-blue-600 text-white" : "text-gray-400");
        document.getElementById("coffee-btn-cal").className =
          "px-3 py-1.5 rounded-lg text-xs font-bold transition-colors " +
          (view === "cal" ? "bg-blue-600 text-white" : "text-gray-400");
        if (view === "cal") renderCoffeeCalendar();
        else renderCoffeeLog();
      }

      // ── Init coffee tab ──────────────────────────────────────────
      async function renderCoffeeTab() {
        if (!document.getElementById("coffee-date").value) {
          document.getElementById("coffee-date").value = formatDate(todayStr());
        }
        if (coffeeView === "log") await renderCoffeeLog();
        else await renderCoffeeCalendar();
      }

      // ── Add coffee entry ─────────────────────────────────────────
      document
        .getElementById("coffee-add-btn")
        .addEventListener("click", async () => {
          const date = getCoffeeDate();
          const location = document
            .getElementById("coffee-location")
            .value.trim();
          const shotsRaw = document.getElementById("coffee-shots").value;
          const ratingRaw = document.getElementById("coffee-rating").value;

          if (!date) {
            showToast("Enter a valid date", "err");
            return;
          }
          if (shotsRaw === "" || isNaN(parseInt(shotsRaw))) {
            showToast("Enter number of shots", "err");
            return;
          }

          const shots = parseInt(shotsRaw);
          const rating = ratingRaw !== "" ? parseFloat(ratingRaw) : null;

          if (rating !== null && (rating < 0 || rating > 10)) {
            showToast("Rating must be 0–10", "err");
            return;
          }

          await db.coffee.add({ date, location, shots, rating });
          showToast("Coffee logged ✓");

          document.getElementById("coffee-shots").value = "";
          document.getElementById("coffee-rating").value = "";
          document.getElementById("coffee-location").value = "";

          if (coffeeView === "log") await renderCoffeeLog();
          else await renderCoffeeCalendar();
        });

      // ── Delete coffee entry ──────────────────────────────────────
      async function deleteCoffeeEntry(id) {
        if (!confirm("Delete this entry?")) return;
        await db.coffee.delete(id);
        if (coffeeView === "log") await renderCoffeeLog();
        else await renderCoffeeCalendar();
      }

      // ── Render log list (selected day only) ─────────────────────
      async function renderCoffeeLog() {
        const date = getCoffeeDate();
        const container = document.getElementById("coffee-log-list");

        if (!date) {
          container.innerHTML = `<p class="text-gray-500 text-center py-6 text-sm">Enter a valid date above.</p>`;
          return;
        }

        const entries = await db.coffee.where("date").equals(date).toArray();

        if (!entries.length) {
          container.innerHTML = `
      <div class="text-center py-8">
        <div class="text-3xl mb-2">☕</div>
        <p class="text-gray-500 text-sm">No coffee logged for ${formatDate(date)}.</p>
      </div>`;
          return;
        }

        const totalShots = entries.reduce((acc, e) => acc + (e.shots || 0), 0);

        container.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <span class="text-sm font-bold text-white">${formatDate(date)}</span>
      <span class="text-xs font-semibold px-2 py-0.5 rounded-full border"
        style="${shotsStyle(totalShots, true)}">${totalShots} shot${totalShots !== 1 ? "s" : ""} total</span>
    </div>
    ${entries
      .map(
        (e) => `
      <div class="flex items-center justify-between bg-gray-800 rounded-xl px-3 py-2.5 mb-2 border border-gray-700/40">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-amber-400 font-extrabold text-lg">${e.shots} shot${e.shots !== 1 ? "s" : ""}</span>
            ${
              e.rating !== null && e.rating !== undefined
                ? `<span class="text-xs text-yellow-300 font-semibold">★ ${e.rating}/10</span>`
                : ""
            }
          </div>
          ${e.location ? `<div class="text-xs text-gray-400 mt-0.5">📍 ${escHtml(e.location)}</div>` : ""}
        </div>
        <button onclick="deleteCoffeeEntry(${e.id})"
          class="text-red-500 hover:text-red-400 text-lg leading-none px-2 ml-2 shrink-0">×</button>
      </div>`,
      )
      .join("")}`;
      }

      // ── Shot colour helpers ──────────────────────────────────────
      function shotsToColor(shots) {
        if (!shots || shots === 0)
          return { bg: "#f9fafb", text: "#111827", border: "#d1d5db" };
        if (shots === 1)
          return { bg: "#d1d5db", text: "#111827", border: "#9ca3af" };
        if (shots === 2)
          return { bg: "#9ca3af", text: "#111827", border: "#6b7280" };
        if (shots === 3)
          return { bg: "#4b5563", text: "#ffffff", border: "#374151" };
        return { bg: "#111827", text: "#ffffff", border: "#030712" };
      }

      function shotsStyle(shots, asBadge = false) {
        const c = shotsToColor(shots);
        if (asBadge)
          return `background:${c.bg};color:${c.text};border-color:${c.border}`;
        return `background:${c.bg};color:${c.text}`;
      }

      // ── Render calendar ──────────────────────────────────────────
      async function renderCoffeeCalendar() {
        const year = coffeeCalYear;
        const month = coffeeCalMonth;

        document.getElementById("cal-month-label").textContent =
          `${MONTH_NAMES[month]} ${year}`;

        const pad = (n) => String(n).padStart(2, "0");
        const first = `${year}-${pad(month + 1)}-01`;
        const last = `${year}-${pad(month + 1)}-${new Date(year, month + 1, 0).getDate()}`;
        const entries = await db.coffee
          .where("date")
          .between(first, last, true, true)
          .toArray();

        const shotsMap = {};
        entries.forEach((e) => {
          shotsMap[e.date] = (shotsMap[e.date] || 0) + (e.shots || 0);
        });

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDow = new Date(year, month, 1).getDay(); // 0=Sun
        const offset = (firstDow + 6) % 7; // Mon=0

        const cells = [];
        for (let i = 0; i < offset; i++) cells.push("<div></div>");

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${year}-${pad(month + 1)}-${pad(day)}`;
          const shots = shotsMap[dateStr] || 0;
          const c = shotsToColor(shots);
          const isToday = dateStr === todayStr();
          const isSel = dateStr === selectedCalDay;
          const ring = isSel
            ? "box-shadow:0 0 0 2px #3b82f6"
            : isToday
              ? "box-shadow:0 0 0 2px #f59e0b"
              : "";
          cells.push(`
      <button onclick="selectCalDay('${dateStr}')"
        class="rounded flex items-center justify-center font-bold transition-transform active:scale-95"
        style="width:40px;height:40px;font-size:12px;background:${c.bg};color:${c.text};${ring}">
        ${day}
      </button>`);
        }

        document.getElementById("cal-grid").innerHTML = cells.join("");

        // ── Monthly summary ──────────────────────────────────────
        const summaryEl = document.getElementById("cal-summary");

        if (!entries.length) {
          summaryEl.innerHTML = "";
        } else {
          const now = new Date();
          const isCurrentMonth =
            year === now.getFullYear() && month === now.getMonth();
          const daysElapsed = isCurrentMonth
            ? now.getDate()
            : new Date(year, month + 1, 0).getDate();
          const totalShots = entries.reduce((a, e) => a + (e.shots || 0), 0);
          const avgShots = (totalShots / daysElapsed).toFixed(1);

          const locEntries = entries.filter(
            (e) => e.location && e.location.trim(),
          );
          const locCount = {};
          locEntries.forEach((e) => {
            locCount[e.location] = (locCount[e.location] || 0) + 1;
          });
          const uniqueLocs = Object.keys(locCount).length;
          const mostVisited = uniqueLocs
            ? Object.entries(locCount).sort((a, b) => b[1] - a[1])[0]
            : null;

          const ratedEntries = entries.filter(
            (e) =>
              e.rating !== null && e.rating !== undefined && e.location?.trim(),
          );
          const locRating = {};
          const locRatingCnt = {};
          ratedEntries.forEach((e) => {
            locRating[e.location] = (locRating[e.location] || 0) + e.rating;
            locRatingCnt[e.location] = (locRatingCnt[e.location] || 0) + 1;
          });
          const topRated = Object.keys(locRating).length
            ? Object.entries(locRating)
                .map(([loc, sum]) => ({ loc, avg: sum / locRatingCnt[loc] }))
                .sort((a, b) => b.avg - a.avg)[0]
            : null;

          summaryEl.innerHTML = `
      <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700/40">
        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">${MONTH_NAMES[month]} ${year} · Summary</div>
        <div class="grid grid-cols-2 gap-3 mb-3">
          <div class="bg-gray-700/50 rounded-xl p-3">
            <div class="text-xs text-gray-500 mb-1">Avg shots / day</div>
            <div class="text-xl font-extrabold text-amber-400">${avgShots}</div>
            <div class="text-[10px] text-gray-600 mt-0.5">over ${daysElapsed} days</div>
          </div>
          <div class="bg-gray-700/50 rounded-xl p-3">
            <div class="text-xs text-gray-500 mb-1">Locations</div>
            <div class="text-xl font-extrabold text-white">${uniqueLocs || "—"}</div>
            <div class="text-[10px] text-gray-600 mt-0.5">unique spots</div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-gray-700/50 rounded-xl p-3">
            <div class="text-xs text-gray-500 mb-1">Most visited</div>
            ${
              mostVisited
                ? `<div class="text-sm font-bold text-white truncate">📍 ${escHtml(mostVisited[0])}</div>
                 <div class="text-[10px] text-gray-500 mt-0.5">${mostVisited[1]} visit${mostVisited[1] !== 1 ? "s" : ""}</div>`
                : `<div class="text-sm text-gray-600">—</div>`
            }
          </div>
          <div class="bg-gray-700/50 rounded-xl p-3">
            <div class="text-xs text-gray-500 mb-1">Top rated</div>
            ${
              topRated
                ? `<div class="text-sm font-bold text-white truncate">📍 ${escHtml(topRated.loc)}</div>
                 <div class="text-[10px] text-yellow-500 mt-0.5">★ ${topRated.avg.toFixed(1)} avg</div>`
                : `<div class="text-sm text-gray-600">—</div>`
            }
          </div>
        </div>
      </div>`;
        }

        // ── Monthly log list ─────────────────────────────────────
        const monthLog = document.getElementById("cal-month-log");

        if (!entries.length) {
          monthLog.innerHTML = `<p class="text-gray-500 text-center text-sm py-4">No coffee logged in ${MONTH_NAMES[month]} ${year}.</p>`;
          await renderCoffeeIntakeStats();
          return;
        }

        const sorted = [...entries].sort(
          (a, b) => b.date.localeCompare(a.date) || b.id - a.id,
        );
        const byDate = {};
        sorted.forEach((e) => {
          (byDate[e.date] = byDate[e.date] || []).push(e);
        });
        const dates = Object.keys(byDate).sort().reverse();

        monthLog.innerHTML = `
    <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">${MONTH_NAMES[month]} ${year} — all entries</div>
    ${dates
      .map((d) => {
        const dayEntries = byDate[d];
        const totalShots = dayEntries.reduce((a, e) => a + (e.shots || 0), 0);
        return `
        <div class="mb-3">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-sm font-bold text-white">${formatDate(d)}</span>
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full border"
              style="${shotsStyle(totalShots, true)}">${totalShots} shot${totalShots !== 1 ? "s" : ""}</span>
          </div>
          ${dayEntries
            .map(
              (e) => `
            <div class="flex items-center justify-between bg-gray-800 rounded-xl px-3 py-2.5 mb-1.5 border border-gray-700/40">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-amber-400 font-bold">${e.shots} shot${e.shots !== 1 ? "s" : ""}</span>
                  ${
                    e.rating !== null && e.rating !== undefined
                      ? `<span class="text-xs text-yellow-300">★ ${e.rating}/10</span>`
                      : ""
                  }
                </div>
                ${e.location ? `<div class="text-xs text-gray-400 mt-0.5">📍 ${escHtml(e.location)}</div>` : ""}
              </div>
              <button onclick="deleteCoffeeEntry(${e.id})"
                class="text-red-500 hover:text-red-400 text-lg leading-none px-2 ml-2 shrink-0">×</button>
            </div>`,
            )
            .join("")}
        </div>`;
      })
      .join("")}`;

        await renderCoffeeIntakeStats();
      }

      // ── Period intake stats ──────────────────────────────────────────
      async function renderCoffeeIntakeStats() {
        const el  = document.getElementById('cal-intake-stats');
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');

        // Build start date strings for each period
        function daysAgo(n) {
          const d = new Date(now);
          d.setDate(d.getDate() - (n - 1));
          return d.toISOString().split('T')[0];
        }
        const todayISO = now.toISOString().split('T')[0];
        const ytdStart = `${now.getFullYear()}-01-01`;
        const ytdDays  = Math.round((now - new Date(ytdStart)) / 86400000) + 1;

        // Sum shots in a date range, divide by total calendar days (zeros included)
        async function avgForPeriod(start, days) {
          const rows = await db.coffee.where('date').between(start, todayISO, true, true).toArray();
          const total = rows.reduce((s, e) => s + (e.shots || 0), 0);
          return total / days;
        }

        const [a7, a14, a30, aYTD] = await Promise.all([
          avgForPeriod(daysAgo(7),   7),
          avgForPeriod(daysAgo(14), 14),
          avgForPeriod(daysAgo(30), 30),
          avgForPeriod(ytdStart,    ytdDays),
        ]);

        const periods = [
          { label: 'Last 7 days',  avg: a7   },
          { label: 'Last 14 days', avg: a14  },
          { label: 'Last 30 days', avg: a30  },
          { label: 'YTD',          avg: aYTD },
        ];

        function meterInfo(avg) {
          if (avg < 1) return { color: '#6b7280', label: 'Very Low'  };
          if (avg < 2) return { color: '#3b82f6', label: 'Low'       };
          if (avg < 4) return { color: '#22c55e', label: 'Optimal'   };
          if (avg < 5) return { color: '#eab308', label: 'Moderate'  };
          if (avg < 6) return { color: '#f97316', label: 'High'      };
          return             { color: '#ef4444', label: 'Dangerous'  };
        }

        el.innerHTML = `
          <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700/40">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">
              Avg Daily Shots
              <span class="text-gray-600 font-normal normal-case ml-1">WHO optimal ≈ 4</span>
            </div>
            ${periods.map(({ label, avg }) => {
              const m   = meterInfo(avg);
              const pct = Math.min(avg / 8 * 100, 100).toFixed(1);
              return `
                <div class="mb-3 last:mb-0">
                  <div class="flex items-center justify-between mb-1.5">
                    <span class="text-xs text-gray-400">${label}</span>
                    <div class="flex items-center gap-2">
                      <span class="text-sm font-bold text-white">${avg.toFixed(1)}</span>
                      <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full"
                        style="background:${m.color}28;color:${m.color}">${m.label}</span>
                    </div>
                  </div>
                  <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
                    <div class="h-full rounded-full" style="width:${pct}%;background:${m.color}"></div>
                  </div>
                </div>`;
            }).join('')}
            <div class="flex flex-wrap gap-x-3 gap-y-1 mt-3 pt-3 border-t border-gray-700/40">
              ${[
                { color: '#6b7280', label: '<1 Very Low'  },
                { color: '#3b82f6', label: '1–2 Low'      },
                { color: '#22c55e', label: '2–4 Optimal'  },
                { color: '#eab308', label: '4–5 Moderate' },
                { color: '#f97316', label: '5–6 High'     },
                { color: '#ef4444', label: '6+ Dangerous' },
              ].map(l => `
                <span class="flex items-center gap-1 text-[10px] text-gray-500">
                  <span class="w-2 h-2 rounded-full shrink-0" style="background:${l.color}"></span>
                  ${l.label}
                </span>`).join('')}
            </div>
          </div>`;
      }

      function shiftCalMonth(delta) {
        coffeeCalMonth += delta;
        if (coffeeCalMonth > 11) {
          coffeeCalMonth = 0;
          coffeeCalYear++;
        }
        if (coffeeCalMonth < 0) {
          coffeeCalMonth = 11;
          coffeeCalYear--;
        }
        selectedCalDay = null;
        renderCoffeeCalendar();
      }

      async function selectCalDay(dateStr) {
        selectedCalDay = selectedCalDay === dateStr ? null : dateStr;
        await renderCoffeeCalendar();
      }

      // ═══════════════════════════════════════════════════════════════
      // ─────────────────────── LIBRARY MODULE ─────────────────────────
      // ═══════════════════════════════════════════════════════════════

      function setLibSubTab(tab) {
        librarySubTab = tab;
        document
          .getElementById("lib-exercises-panel")
          .classList.toggle("hidden", tab !== "exercises");
        document
          .getElementById("lib-programs-panel")
          .classList.toggle("hidden", tab !== "programs");
        document.getElementById("lib-btn-exercises").className =
          "px-3 py-1.5 rounded-lg text-xs font-bold transition-colors " +
          (tab === "exercises" ? "bg-blue-600 text-white" : "text-gray-400");
        document.getElementById("lib-btn-programs").className =
          "px-3 py-1.5 rounded-lg text-xs font-bold transition-colors " +
          (tab === "programs" ? "bg-blue-600 text-white" : "text-gray-400");
        if (tab === "exercises") renderExercisesSection();
        else renderProgramsSection();
      }

      async function renderLibraryTab() {
        if (librarySubTab === "exercises") await renderExercisesSection();
        else await renderProgramsSection();
      }

      // ── Exercises section ─────────────────────────────────────────

      async function addExerciseToLib() {
        const name = document.getElementById("lib-ex-name").value.trim();
        const muscle = document.getElementById("lib-ex-muscle").value.trim();
        if (!name) {
          showToast("Enter exercise name", "err");
          return;
        }

        const all = await db.exercisesLib.toArray();
        if (all.find((e) => e.name.toLowerCase() === name.toLowerCase())) {
          showToast("Exercise already exists", "err");
          return;
        }

        await db.exercisesLib.add({ name, muscleGroup: muscle || "" });
        showToast("Exercise added ✓");
        document.getElementById("lib-ex-name").value = "";
        document.getElementById("lib-ex-muscle").value = "";
        await renderExercisesSection();
      }

      async function deleteExerciseFromLib(id) {
        const used = await db.programExercises
          .where("exerciseLibId")
          .equals(id)
          .count();
        if (used > 0) {
          showToast("Remove from programs first", "err");
          return;
        }
        if (!confirm("Delete this exercise from library?")) return;
        await db.exercisesLib.delete(id);
        await renderExercisesSection();
      }

      async function renderExercisesSection() {
        const container = document.getElementById("lib-exercises-list");
        const exercises = await db.exercisesLib.toArray();

        if (!exercises.length) {
          container.innerHTML = `<p class="text-gray-500 text-center py-8 text-sm">No exercises in library.</p>`;
          return;
        }

        // Group by muscle group
        const groups = {};
        exercises.forEach((e) => {
          const g = e.muscleGroup || "Other";
          (groups[g] = groups[g] || []).push(e);
        });

        const muscleOrder = [
          "Chest",
          "Back",
          "Shoulders",
          "Biceps",
          "Triceps",
          "Legs",
          "Core",
        ];
        const sortedGroups = Object.keys(groups).sort((a, b) => {
          const ai = muscleOrder.indexOf(a),
            bi = muscleOrder.indexOf(b);
          if (ai === -1 && bi === -1) return a.localeCompare(b);
          if (ai === -1) return 1;
          if (bi === -1) return -1;
          return ai - bi;
        });

        container.innerHTML = sortedGroups
          .map(
            (g) => `
    <div class="mb-3">
      <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5 px-1">${escHtml(g)}</div>
      ${groups[g]
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(
          (e) => `
        <div class="flex items-center justify-between bg-gray-800 rounded-xl px-3 py-2.5 mb-1.5 border border-gray-700/40">
          <span class="text-white font-medium text-sm">${escHtml(e.name)}</span>
          <button onclick="deleteExerciseFromLib(${e.id})"
            class="text-red-500 hover:text-red-400 text-lg leading-none px-2 ml-2 shrink-0">×</button>
        </div>`,
        )
        .join("")}
    </div>`,
          )
          .join("");
      }

      // ── Programs section ──────────────────────────────────────────

      async function createProgram() {
        const name = document.getElementById("lib-prog-name").value.trim();
        if (!name) {
          showToast("Enter program name", "err");
          return;
        }

        const all = await db.programs.toArray();
        if (all.find((p) => p.name.toLowerCase() === name.toLowerCase())) {
          showToast("Program already exists", "err");
          return;
        }

        await db.programs.add({ name });
        showToast("Program created ✓");
        document.getElementById("lib-prog-name").value = "";
        await renderProgramsSection();
        await populateProgramDropdown();
      }

      async function deleteProgram(id) {
        if (!confirm("Delete this program and remove all its exercises?"))
          return;
        await db.programExercises.where("programId").equals(id).delete();
        await db.programs.delete(id);
        await renderProgramsSection();
        await populateProgramDropdown();
      }

      async function renderProgramsSection() {
        const container = document.getElementById("lib-programs-list");
        const programs = await db.programs.toArray();

        if (!programs.length) {
          container.innerHTML = `<p class="text-gray-500 text-center py-8 text-sm">No programs yet. Create one above.</p>`;
          return;
        }

        const htmlParts = await Promise.all(
          programs.map(async (p) => {
            const progExs = await db.programExercises
              .where("programId")
              .equals(p.id)
              .sortBy("order");
            const libEntries = await db.exercisesLib.bulkGet(
              progExs.map((pe) => pe.exerciseLibId),
            );

            const exerciseRows = progExs
              .map((pe, i) => {
                const lib = libEntries[i];
                if (!lib) return "";
                return `
        <div class="flex items-center gap-2 py-2 border-t border-gray-700/40">
          <span class="text-xs text-gray-500 w-5 text-center shrink-0">${i + 1}</span>
          <span class="flex-1 text-sm text-white">${escHtml(lib.name)}</span>
          ${lib.muscleGroup ? `<span class="text-xs text-gray-500 shrink-0">${escHtml(lib.muscleGroup)}</span>` : ""}
          <div class="flex items-center gap-1 shrink-0">
            ${
              i > 0
                ? `<button onclick="moveExerciseInProgram(${pe.id},-1)" title="Move up"
                   class="text-gray-400 hover:text-white text-sm w-6 h-6 flex items-center justify-center rounded hover:bg-gray-600">↑</button>`
                : '<span class="w-6"></span>'
            }
            ${
              i < progExs.length - 1
                ? `<button onclick="moveExerciseInProgram(${pe.id},1)" title="Move down"
                   class="text-gray-400 hover:text-white text-sm w-6 h-6 flex items-center justify-center rounded hover:bg-gray-600">↓</button>`
                : '<span class="w-6"></span>'
            }
            <button onclick="removeExerciseFromProgram(${pe.id})"
              class="text-red-500 hover:text-red-400 text-base w-6 h-6 flex items-center justify-center rounded hover:bg-gray-700 ml-1">×</button>
          </div>
        </div>`;
              })
              .join("");

            // Build the "add exercise" dropdown (show available lib exercises not yet in program)
            const allLibEx = await db.exercisesLib.toArray();
            const usedIds = new Set(progExs.map((pe) => pe.exerciseLibId));
            const available = allLibEx
              .filter((e) => !usedIds.has(e.id))
              .sort((a, b) => a.name.localeCompare(b.name));

            const addExHtml = available.length
              ? `<div class="flex gap-2 mt-3 pt-3 border-t border-gray-700/40">
           <select id="prog-ex-sel-${p.id}"
             class="flex-1 bg-gray-700 rounded-xl px-3 py-2 text-white border border-gray-600 focus:border-blue-500 focus:outline-none text-sm">
             ${available
               .map(
                 (e) =>
                   `<option value="${e.id}">${escHtml(e.name)}${e.muscleGroup ? " · " + escHtml(e.muscleGroup) : ""}</option>`,
               )
               .join("")}
           </select>
           <button onclick="addExerciseToProgram(${p.id})"
             class="bg-blue-600 hover:bg-blue-500 rounded-xl px-3 py-2 text-sm font-bold shrink-0 transition-colors">+ Add</button>
         </div>`
              : `<p class="text-xs text-gray-600 text-center py-2 mt-2 border-t border-gray-700/40">All library exercises already added</p>`;

            return `
      <div class="bg-gray-800 rounded-2xl mb-3 border border-gray-700/40 overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-700/40">
          <span class="font-bold text-white">${escHtml(p.name)}</span>
          <button onclick="deleteProgram(${p.id})"
            class="text-red-500 hover:text-red-400 text-xs font-semibold border border-red-800/50 rounded-lg px-2 py-1">Delete</button>
        </div>
        <div class="px-4 pb-3">
          ${
            progExs.length
              ? exerciseRows
              : '<p class="text-xs text-gray-600 text-center py-3">No exercises yet — add below</p>'
          }
          ${addExHtml}
        </div>
      </div>`;
          }),
        );

        container.innerHTML = htmlParts.join("");
      }

      async function addExerciseToProgram(programId) {
        const sel = document.getElementById(`prog-ex-sel-${programId}`);
        if (!sel) return;
        const libId = parseInt(sel.value);
        if (!libId) return;

        const existing = await db.programExercises
          .where("programId")
          .equals(programId)
          .toArray();
        const maxOrder =
          existing.length > 0
            ? Math.max(...existing.map((pe) => pe.order))
            : -1;

        await db.programExercises.add({
          programId,
          exerciseLibId: libId,
          order: maxOrder + 1,
        });
        await renderProgramsSection();
      }

      async function removeExerciseFromProgram(id) {
        await db.programExercises.delete(id);
        await renderProgramsSection();
      }

      async function moveExerciseInProgram(id, direction) {
        const pe = await db.programExercises.get(id);
        if (!pe) return;

        const all = await db.programExercises
          .where("programId")
          .equals(pe.programId)
          .sortBy("order");
        const idx = all.findIndex((x) => x.id === id);
        const swapIdx = idx + direction;
        if (swapIdx < 0 || swapIdx >= all.length) return;

        const other = all[swapIdx];
        // Swap order values
        await db.programExercises.update(pe.id, { order: other.order });
        await db.programExercises.update(other.id, { order: pe.order });
        await renderProgramsSection();
      }

      // ─────────────────────── INSTALL BANNER ───────────────────────
      function renderInstallBanner() {
        const isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;
        if (!isStandalone) {
          document.getElementById("install-banner").classList.remove("hidden");
        }
      }
    </script>
  </body>
</html>
